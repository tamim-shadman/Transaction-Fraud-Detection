version: "3.8"

services:
  fraud-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-analytics-console
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=4173
      - LOG_LEVEL=INFO
      - STORAGE_LIMIT_MB=500
      - ENABLE_DIAGNOSTICS=true
    volumes:
      # Persistent logs mount
      - ./logs:/app/logs
      # Persistent backups mount
      - ./backups:/app/backups
      # Persistent snapshot metadata mount
      - ./app/public/data/snapshots:/app/app/public/data/snapshots
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py", "--type", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: false
